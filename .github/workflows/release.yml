name: VideoCatch verified platform builds
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: videocatch-build-${{ github.ref }}
  cancel-in-progress: false
jobs:
  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            arch: arm64
            python_arch: arm64
          - runner: macos-15-intel
            arch: x86_64
            python_arch: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      PYTHONUTF8: '1'
      MACOSX_DEPLOYMENT_TARGET: '14.0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: ${{ matrix.python_arch }}
      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify platform and isolated capture planning
        run: |
          test "$(uname -m)" = '${{ matrix.arch }}'
          python -m unittest discover -s tests -p 'test_capture_macos.py' -v
          python -m unittest discover -s tests -p 'test_recorder.py' -v
          python -m unittest discover -s tests -p 'test_runtime_paths.py' -v
          node --test tests/extension.test.cjs
      - name: Build native application and client
        run: python build_macos.py --arch '${{ matrix.arch }}'
      - name: Verify extracted app and synthetic download / clip
        id: verify_package
        run: python scripts/verify_macos.py releases/VideoCatch-v0.5.0-macOS-${{ matrix.arch }}.zip --report releases/verification-v0.5.0-macOS-${{ matrix.arch }}.json --diagnostics releases/diagnostics-macOS-${{ matrix.arch }} --gui
      - name: Preserve verification diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: VideoCatch-v0.5.0-macOS-${{ matrix.arch }}-diagnostics
          path: |
            releases/verification-v0.5.0-macOS-${{ matrix.arch }}.json
            releases/diagnostics-macOS-${{ matrix.arch }}/
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: success() && steps.verify_package.outcome == 'success'
        with:
          name: VideoCatch-v0.5.0-macOS-${{ matrix.arch }}-verified
          path: |
            releases/VideoCatch-v0.5.0-macOS-${{ matrix.arch }}.zip
            releases/checksums-v0.5.0-macOS-${{ matrix.arch }}.json
            releases/verification-v0.5.0-macOS-${{ matrix.arch }}.json
          if-no-files-found: error
          retention-days: 30
